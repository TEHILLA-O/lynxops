[workspace]
resolver = "2"
members = [
    "crates/lynx-core",
    "crates/lynx-proc",
    "crates/lynx-cgroup",
    "crates/lynx-network",
    "crates/lynx-systemd",
    "crates/lynx-snapshot",
    "crates/lynx-ebpf-common",
    "crates/lynx-ebpf",
    "crates/lynx-tui",
    "crates/lynx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["LynxOps Contributors"]
repository = "https://github.com/lynxops/lynxops"
homepage = "https://github.com/lynxops/lynxops"
description = "Linux observability and incident-triage CLI/TUI"
keywords = ["linux", "observability", "ebpf", "procfs", "tui"]
categories = ["command-line-utilities", "os::linux-apis"]

[workspace.dependencies]
lynx-core = { path = "crates/lynx-core", version = "0.1.0" }
lynx-proc = { path = "crates/lynx-proc", version = "0.1.0" }
lynx-cgroup = { path = "crates/lynx-cgroup", version = "0.1.0" }
lynx-network = { path = "crates/lynx-network", version = "0.1.0" }
lynx-systemd = { path = "crates/lynx-systemd", version = "0.1.0" }
lynx-snapshot = { path = "crates/lynx-snapshot", version = "0.1.0" }
lynx-ebpf-common = { path = "crates/lynx-ebpf-common", version = "0.1.0" }
lynx-ebpf = { path = "crates/lynx-ebpf", version = "0.1.0" }
lynx-tui = { path = "crates/lynx-tui", version = "0.1.0" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
libc = "0.2"
owo-colors = "4"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
